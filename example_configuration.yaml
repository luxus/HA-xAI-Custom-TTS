# Example Configuration for SpaceXAI (Grok conversation + TTS + STT)

# Add via UI:
# Settings → Devices & Services → Add Integration → SpaceXAI
# Sign in with Grok (OAuth) or paste a console.x.ai API key as fallback.

# Assist pipeline:
#   conversation agent: conversation.spacexai_grok
#   speech-to-text:     stt.spacexai_stt
#   text-to-speech:     tts.spacexai_tts
# (or let jev_assist hand off grok routes to conversation.spacexai_grok)

# After setup, TTS:

automation:
  - alias: "Morning Announcement with SpaceXAI TTS"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: tts.speak
        data:
          entity_id: tts.spacexai_tts
          message: "Good morning! Today is {{ now().strftime('%A, %B %d') }}."
          media_player_entity_id: media_player.bedroom_speaker
          options:
            voice: "ara"
            language: "en"
            codec: "mp3"
            sample_rate: 24000

  - alias: "Security Alert"
    trigger:
      - platform: state
        entity_id: binary_sensor.front_door
        to: "on"
    action:
      - service: tts.speak
        data:
          entity_id: tts.spacexai_tts
          message: "Security alert: Front door has been opened."
          media_player_entity_id: media_player.living_room_speaker
          options:
            voice: "leo"
            language: "en"

script:
  get_spacexai_voices:
    sequence:
      - service: spacexai.get_voices
        data:
          search_text: "female"
